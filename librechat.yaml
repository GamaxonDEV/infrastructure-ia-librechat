version: 1.3.16
cache: true

interface:
  customWelcome: "Bienvenue sur ton infrastructure IA locale"
  logo: "https://librechat.axlabs.fr/assets/logo.svg"

endpoints:
  custom:
    - name: "Ollama Local"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1"
      models:
        default:
          - "qwen3vl-fast"
          - "qwen3-vl:8b"
        fetch: true
      titleConvo: true
      titleModel: "qwen3vl-fast"
      modelDisplayLabel: "Ollama"

    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "nvidia/nemotron-3-ultra-550b-a55b:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
          - "z-ai/glm-5.2:free"
        fetch: false
      titleConvo: true
      titleModel: "nvidia/nemotron-3-super-120b-a12b:free"
      modelDisplayLabel: "OpenRouter"
      dropParams:
        - "stop"

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "nemotron-3-ultra"
      label: "Nemotron 3 Ultra"
      default: true
      preset:
        endpoint: "OpenRouter"
        model: "nvidia/nemotron-3-ultra-550b-a55b:free"
        temperature: 0.6
        top_p: 0.9
        max_tokens: 2048
        promptPrefix: "Tu réponds systématiquement en français. Tu vas droit au but, sans préambule."

    - name: "glm-5-2"
      label: "GLM 5.2"
      preset:
        endpoint: "OpenRouter"
        model: "z-ai/glm-5.2:free"
        temperature: 0.6
        promptPrefix: "Tu réponds systématiquement en français. Tu vas droit au but, sans préambule."

    - name: "qwen-local"
      label: "Qwen3-VL (local)"
      preset:
        endpoint: "Ollama Local"
        model: "qwen3vl-fast"
        temperature: 0.7
        promptPrefix: "Tu réponds systématiquement en français. Tu vas droit au but, sans préambule."

webSearch:
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  jinaApiKey: "${JINA_API_KEY}"
  searchProvider: "searxng"
  scraperProvider: "firecrawl"
  rerankerType: "jina"
  allowedAddresses:
    - "searxng:8080"